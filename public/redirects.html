<!DOCTYPE html>
<html>
<head>
  <title>Redirecting...</title>
  <script>
    (function() {
      const queryString = window.location.search;
      const basePath = window.location.origin;
      // This builds the correct URL: https://.../#/download?params...
      const newUrl = basePath + '/#/' + 'download' + queryString;
      // Immediately redirect to the correct hash-based URL
      window.location.replace(newUrl);
    })();
  </script>
</head>
<body>
  <p>Please wait while we redirect you...</p>
</body>
</html>
